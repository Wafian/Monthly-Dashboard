<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks</title>
<style>
  :root {
    --bg: #ffffff;
    --sidebar-bg: #f5f5f7;
    --detail-bg: #fafafa;
    --border: #ececec;
    --border-strong: #d8d8d8;
    --text: #232323;
    --text-secondary: #8a8a8e;
    --text-tertiary: #b0b0b4;
    --accent: #4772fa;
    --accent-hover: #3a5fd9;
    --hover: #f0f0f3;
    --selected: #e8eefe;
    --p1: #d52b24;
    --p2: #fa9939;
    --p3: #4772fa;
    --p4: #c4c4c4;
    --tag-bg: #eef0f4;
    --tag-text: #5a5a5e;
    --due-today: #d52b24;
    --due-soon: #fa9939;
    --due-future: #8a8a8e;
    --completed: #b0b0b4;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100vh; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    font-size: 14px; color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .app { display: grid; grid-template-columns: 240px 1fr 360px; height: 100vh; }
  .app.detail-closed { grid-template-columns: 240px 1fr 0; }

  /* Sidebar */
  .sidebar {
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    padding: 16px 8px; overflow-y: auto; display: flex; flex-direction: column;
  }
  .sidebar-brand {
    padding: 4px 12px 16px; font-weight: 600; font-size: 15px;
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar-brand .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .sidebar-section { margin-top: 12px; }
  .sidebar-section-label {
    padding: 6px 12px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--text-tertiary); font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; margin: 1px 0; border-radius: 6px; cursor: pointer;
    font-size: 13.5px; color: var(--text); user-select: none;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--selected); color: var(--accent); font-weight: 500; }
  .nav-item .label { display: flex; align-items: center; gap: 10px; }
  .nav-item .icon { width: 16px; text-align: center; opacity: 0.7; }
  .nav-item .count {
    font-size: 11.5px; color: var(--text-tertiary);
    background: transparent; padding: 0 6px;
  }
  .nav-item.active .count { color: var(--accent); }

  /* Main */
  .main { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .main-header {
    padding: 18px 28px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .main-title { font-size: 20px; font-weight: 600; }
  .main-meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    background: transparent; border: none; padding: 6px 8px;
    border-radius: 6px; cursor: pointer; color: var(--text-secondary);
    font-size: 13px;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  .add-bar {
    padding: 10px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .add-bar input {
    flex: 1; border: none; outline: none; font-size: 14px;
    background: transparent; color: var(--text); padding: 6px 0;
  }
  .add-bar input::placeholder { color: var(--text-tertiary); }
  .add-bar .plus {
    width: 18px; height: 18px; border: 1.5px solid var(--text-tertiary);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: var(--text-tertiary); font-size: 12px; line-height: 1;
  }

  .task-list { flex: 1; overflow-y: auto; padding: 4px 16px 80px; }

  .task-group-label {
    font-size: 11.5px; color: var(--text-tertiary); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 16px 12px 6px;
  }

  .task {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 12px; border-radius: 6px; cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .task:hover { background: var(--hover); }
  .task.selected { background: var(--selected); }

  .checkbox {
    margin-top: 1px; width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid var(--p4); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; transition: all 0.15s;
    position: relative;
  }
  .checkbox.p1 { border-color: var(--p1); }
  .checkbox.p2 { border-color: var(--p2); }
  .checkbox.p3 { border-color: var(--p3); }
  .checkbox:hover { background: rgba(0,0,0,0.04); }
  .checkbox.completed {
    background: var(--p4); border-color: var(--p4);
  }
  .checkbox.completed.p1 { background: var(--p1); border-color: var(--p1); }
  .checkbox.completed.p2 { background: var(--p2); border-color: var(--p2); }
  .checkbox.completed.p3 { background: var(--p3); border-color: var(--p3); }
  .checkbox.completed::after {
    content: ""; width: 8px; height: 4px;
    border-left: 1.5px solid white; border-bottom: 1.5px solid white;
    transform: rotate(-45deg) translate(1px, -1px);
  }

  .task-body { flex: 1; min-width: 0; }
  .task-title {
    font-size: 14px; line-height: 1.4; color: var(--text);
    word-wrap: break-word;
  }
  .task.completed .task-title {
    text-decoration: line-through; color: var(--completed);
  }
  .task-meta {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-top: 5px; font-size: 12px;
  }
  .due {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--due-future); font-size: 12px;
  }
  .due.today { color: var(--due-today); font-weight: 500; }
  .due.soon { color: var(--due-soon); }
  .due.none { color: var(--text-tertiary); }
  .tag {
    background: var(--tag-bg); color: var(--tag-text);
    padding: 1px 7px; border-radius: 3px; font-size: 11px;
    font-weight: 500;
  }
  .tag.status-briefed { background: #e8f0fe; color: #3a5fd9; }
  .tag.status-not-briefed { background: #fff0e6; color: #c2691a; }
  .tag.status-in-progress { background: #e6f7ec; color: #1f9c4d; }

  .subtask-toggle {
    margin-left: auto; font-size: 11px; color: var(--text-tertiary);
    background: transparent; border: none; cursor: pointer; padding: 2px 6px;
    border-radius: 4px;
  }
  .subtask-toggle:hover { background: var(--hover); color: var(--text); }

  .subtasks {
    margin-left: 28px; border-left: 1px solid var(--border); padding-left: 0;
    display: none;
  }
  .subtasks.expanded { display: block; }
  .subtask {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px; cursor: pointer; border-radius: 4px;
    font-size: 13px;
  }
  .subtask:hover { background: var(--hover); }
  .subtask .checkbox { width: 14px; height: 14px; }
  .subtask.completed .subtask-title {
    text-decoration: line-through; color: var(--completed);
  }
  .subtask-title { flex: 1; }
  .subtask-note { font-size: 11.5px; color: var(--text-tertiary); }

  /* Detail panel */
  .detail {
    background: var(--detail-bg); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 0; display: flex; flex-direction: column;
  }
  .detail-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 32px;
  }
  .detail-header {
    padding: 18px 22px 6px; display: flex; align-items: flex-start;
    gap: 12px; border-bottom: 1px solid var(--border);
  }
  .detail-header .checkbox { margin-top: 4px; }
  .detail-title {
    flex: 1; font-size: 17px; font-weight: 600; line-height: 1.3;
    border: none; outline: none; background: transparent; color: var(--text);
    font-family: inherit; resize: none; padding: 0;
    overflow: hidden;
  }
  .detail-close {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-tertiary); font-size: 18px; padding: 0 4px;
  }
  .detail-close:hover { color: var(--text); }

  .detail-body { padding: 14px 22px 28px; }
  .field {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .field-label {
    width: 100px; color: var(--text-secondary); font-size: 12.5px;
    flex-shrink: 0; padding-top: 3px;
  }
  .field-value {
    flex: 1; color: var(--text); min-width: 0;
  }
  .field-value input, .field-value select, .field-value textarea {
    width: 100%; border: none; background: transparent; outline: none;
    font-family: inherit; font-size: 13px; color: var(--text); padding: 2px 0;
    resize: none;
  }
  .field-value textarea { min-height: 20px; }
  .field-value input:focus, .field-value textarea:focus, .field-value select:focus {
    background: white; padding: 3px 6px; border-radius: 4px;
    margin: -3px -6px; box-shadow: 0 0 0 1px var(--accent);
  }
  .priority-pills { display: flex; gap: 4px; }
  .priority-pill {
    padding: 2px 10px; border-radius: 4px; font-size: 11px;
    cursor: pointer; background: var(--tag-bg); color: var(--tag-text);
    font-weight: 500;
  }
  .priority-pill.active { color: white; }
  .priority-pill.active.p1 { background: var(--p1); }
  .priority-pill.active.p2 { background: var(--p2); }
  .priority-pill.active.p3 { background: var(--p3); }
  .priority-pill.active.p4 { background: var(--p4); }

  .subtask-section {
    margin-top: 14px; padding-top: 12px;
  }
  .subtask-section-label {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-tertiary); font-weight: 600; margin-bottom: 6px;
  }
  .detail .subtask {
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .detail .subtask:hover { background: transparent; }
  .add-subtask {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    color: var(--text-tertiary); cursor: pointer; font-size: 13px;
  }
  .add-subtask:hover { color: var(--accent); }
  .add-subtask input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 13px; color: var(--text);
  }

  .delete-btn {
    margin-top: 18px; background: transparent; border: 1px solid var(--border-strong);
    color: var(--text-secondary); padding: 7px 12px; border-radius: 6px;
    cursor: pointer; font-size: 12.5px;
  }
  .delete-btn:hover { background: #fef0ef; color: var(--p1); border-color: var(--p1); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 64px 24px; color: var(--text-tertiary);
    text-align: center;
  }
  .empty-state .ico { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }

  /* Mobile */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr !important; }
    .sidebar { display: none; }
    .sidebar.open { display: flex; position: fixed; top: 0; left: 0;
      width: 80%; max-width: 300px; height: 100vh; z-index: 100;
      box-shadow: 2px 0 12px rgba(0,0,0,0.1); }
    .detail { display: none; }
    .detail.open { display: flex; position: fixed; top: 0; right: 0;
      width: 100%; height: 100vh; z-index: 100; background: var(--detail-bg); }
    .mobile-menu { display: inline-flex !important; }
    .main-header { padding: 14px 18px 10px; }
    .add-bar { padding: 10px 18px; }
    .task-list { padding: 4px 8px 80px; }
  }
  .mobile-menu { display: none; }
  .scrim {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2);
    z-index: 99;
  }
  .scrim.show { display: block; }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="dot"></span> Tasks</div>

    <div class="sidebar-section">
      <div class="nav-item" data-view="today">
        <span class="label"><span class="icon">●</span>Today</span>
        <span class="count" id="count-today">0</span>
      </div>
      <div class="nav-item active" data-view="all">
        <span class="label"><span class="icon">≡</span>All</span>
        <span class="count" id="count-all">0</span>
      </div>
      <div class="nav-item" data-view="upcoming">
        <span class="label"><span class="icon">▸</span>Next 7 days</span>
        <span class="count" id="count-upcoming">0</span>
      </div>
      <div class="nav-item" data-view="nodate">
        <span class="label"><span class="icon">○</span>No date</span>
        <span class="count" id="count-nodate">0</span>
      </div>
      <div class="nav-item" data-view="completed">
        <span class="label"><span class="icon">✓</span>Completed</span>
        <span class="count" id="count-completed">0</span>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Lists</div>
      <div class="nav-item" data-view="list:MyBL">
        <span class="label"><span class="icon" style="color:#4772fa">▮</span>MyBL</span>
        <span class="count" id="count-list-MyBL">0</span>
      </div>
      <div class="nav-item" data-view="list:Rider Pack">
        <span class="label"><span class="icon" style="color:#fa9939">▮</span>Rider Pack</span>
        <span class="count" id="count-list-RiderPack">0</span>
      </div>
      <div class="nav-item" data-view="list:Creative">
        <span class="label"><span class="icon" style="color:#1f9c4d">▮</span>Creative</span>
        <span class="count" id="count-list-Creative">0</span>
      </div>
      <div class="nav-item" data-view="list:Brand">
        <span class="label"><span class="icon" style="color:#d52b24">▮</span>Brand</span>
        <span class="count" id="count-list-Brand">0</span>
      </div>
    </div>

    <div style="flex:1"></div>
    <div class="nav-item" id="resetBtn" style="color: var(--text-tertiary); font-size: 12px;">
      <span class="label">↻ Reset to original list</span>
    </div>
  </aside>

  <!-- Main -->
  <section class="main">
    <div class="main-header">
      <div>
        <div class="main-title" id="viewTitle">
          <button class="icon-btn mobile-menu" id="menuBtn">≡</button>
          All
        </div>
        <div class="main-meta" id="viewMeta"></div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="sortBtn" title="Sort by deadline">⇅</button>
      </div>
    </div>

    <div class="add-bar">
      <span class="plus">+</span>
      <input id="addInput" type="text" placeholder="Add task — press Enter" />
    </div>

    <div class="task-list" id="taskList"></div>
  </section>

  <!-- Detail -->
  <aside class="detail" id="detail">
    <div class="detail-empty" id="detailEmpty">Select a task to see details</div>
    <div id="detailContent" style="display:none; flex-direction:column; flex:1;"></div>
  </aside>
</div>
<div class="scrim" id="scrim"></div>

<script>
// ─────────────────────────────────────────────────────────────
// Seed data
// ─────────────────────────────────────────────────────────────
const SEED = [
  {

  },

    list: "MyBL",
    completed: false,
    subtasks: [],
  },
  {

    title: "MyBL Minute Pack",
    deadline: "2026-07-02",
    priority: 3,
    status: "Briefed",
    internal: "Nazifa",
    external: "X",
    notes: "",
    list: "MyBL",
    completed: false,
    subtasks: [],
  },
  {
    id: "t4",
    title: "Rider Pack Headline Description",
    deadline: "2026-06-30",
    priority: 1,
    status: "Briefed",
    internal: "Arnab",
    external: "X",
    notes: "Due today.",
    list: "Rider Pack",
    completed: false,
    subtasks: [],
  },
  {
    id: "t5",
    title: "New Rider Pack Creative",
    deadline: null,
    priority: 3,
    status: "Not briefed",
    internal: "Arnab",
    external: "X",
    notes: "",
    list: "Rider Pack",
    completed: false,
    subtasks: [],
  },
  {
    id: "t6",
    title: "Portfolio Revision Creative Adaptation",
    deadline: "2026-07-02",
    priority: 2,
    status: "Briefed",
    internal: "Fahim / Ala",
    external: "X",
    notes: "",
    list: "Creative",
    completed: false,
    subtasks: [],
  },
  {
    id: "t7",
    title: "Bill Pay Creative Update",
    deadline: null,
    priority: 4,
    status: "Not briefed",
    internal: "",
    external: "X",
    notes: "",
    list: "Creative",
    completed: false,
    subtasks: [],
  },
  {
    id: "t8",
    title: "Islamic Creative Update",
    deadline: null,
    priority: 4,
    status: "Not briefed",
    internal: "",
    external: "X",
    notes: "",
    list: "Creative",
    completed: false,
    subtasks: [],
  },
  {
    id: "t9",
    title: "Orange Code Logo",
    deadline: null,
    priority: 3,
    status: "In progress",
    internal: "",
    external: "X",
    notes: "Working on logo animation.",
    list: "Brand",
    completed: false,
    subtasks: [],
  },
];

// ─────────────────────────────────────────────────────────────
// State + storage
// ─────────────────────────────────────────────────────────────
let state = {
  tasks: [],
  view: "all",
  selectedId: null,
  sortByDeadline: true,
};

const STORAGE_KEY = "tasks-v1";

// Persistence backed by localStorage so the app runs as a plain web page
// (GitHub Pages / Netlify / open the file directly) — no Claude artifact host needed.
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.tasks = JSON.parse(raw);
    else {
      state.tasks = JSON.parse(JSON.stringify(SEED));
      save();
    }
  } catch {
    state.tasks = JSON.parse(JSON.stringify(SEED));
    try { save(); } catch {}
  }
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks)); }
  catch (e) { console.warn("Save failed", e); }
}

// ─────────────────────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────────────────────
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
function toDate(s) { if (!s) return null; const d = new Date(s + "T00:00:00"); return d; }
function daysUntil(s) {
  const d = toDate(s); if (!d) return null;
  return Math.round((d - TODAY) / 86400000);
}
function fmtDate(s) {
  if (!s) return "";
  const d = toDate(s);
  const du = daysUntil(s);
  if (du === 0) return "Today";
  if (du === 1) return "Tomorrow";
  if (du === -1) return "Yesterday";
  if (du < 0) return `${Math.abs(du)}d overdue`;
  if (du < 7) return d.toLocaleDateString("en-US", { weekday: "short" });
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function dueClass(s) {
  const du = daysUntil(s);
  if (du === null) return "none";
  if (du <= 0) return "today";
  if (du <= 2) return "soon";
  return "future";
}

function priorityClass(p) { return p ? `p${p}` : "p4"; }
function priorityLabel(p) {
  return p === 1 ? "High" : p === 2 ? "Medium" : p === 3 ? "Low" : "None";
}

// ─────────────────────────────────────────────────────────────
// Filtering + grouping
// ─────────────────────────────────────────────────────────────
function visibleTasks() {
  const v = state.view;
  let t = state.tasks.slice();
  if (v === "all") t = t.filter(x => !x.completed);
  else if (v === "today") t = t.filter(x => !x.completed && daysUntil(x.deadline) !== null && daysUntil(x.deadline) <= 0);
  else if (v === "upcoming") t = t.filter(x => !x.completed && daysUntil(x.deadline) !== null && daysUntil(x.deadline) >= 0 && daysUntil(x.deadline) <= 7);
  else if (v === "nodate") t = t.filter(x => !x.completed && !x.deadline);
  else if (v === "completed") t = t.filter(x => x.completed);
  else if (v.startsWith("list:")) {
    const list = v.slice(5);
    t = t.filter(x => x.list === list && !x.completed);
  }

  if (state.sortByDeadline) {
    t.sort((a, b) => {
      const da = a.deadline ? toDate(a.deadline).getTime() : Infinity;
      const db = b.deadline ? toDate(b.deadline).getTime() : Infinity;
      if (da !== db) return da - db;
      return (a.priority || 9) - (b.priority || 9);
    });
  }
  return t;
}

function groupTasks(tasks) {
  const groups = { overdue: [], today: [], upcoming: [], later: [], none: [] };
  for (const t of tasks) {
    const du = daysUntil(t.deadline);
    if (du === null) groups.none.push(t);
    else if (du < 0) groups.overdue.push(t);
    else if (du === 0) groups.today.push(t);
    else if (du <= 7) groups.upcoming.push(t);
    else groups.later.push(t);
  }
  return groups;
}

// ─────────────────────────────────────────────────────────────
// Rendering
// ─────────────────────────────────────────────────────────────
function render() {
  renderCounts();
  renderTaskList();
  renderDetail();
  renderViewHeader();
  document.querySelectorAll(".nav-item[data-view]").forEach(el => {
    el.classList.toggle("active", el.dataset.view === state.view);
  });
}

function renderCounts() {
  const ts = state.tasks;
  const open = ts.filter(t => !t.completed);
  document.getElementById("count-all").textContent = open.length;
  document.getElementById("count-today").textContent =
    open.filter(t => daysUntil(t.deadline) !== null && daysUntil(t.deadline) <= 0).length;
  document.getElementById("count-upcoming").textContent =
    open.filter(t => { const d = daysUntil(t.deadline); return d !== null && d >= 0 && d <= 7; }).length;
  document.getElementById("count-nodate").textContent = open.filter(t => !t.deadline).length;
  document.getElementById("count-completed").textContent = ts.filter(t => t.completed).length;
  document.getElementById("count-list-MyBL").textContent = open.filter(t => t.list === "MyBL").length;
  document.getElementById("count-list-RiderPack").textContent = open.filter(t => t.list === "Rider Pack").length;
  document.getElementById("count-list-Creative").textContent = open.filter(t => t.list === "Creative").length;
  document.getElementById("count-list-Brand").textContent = open.filter(t => t.list === "Brand").length;
}

function renderViewHeader() {
  const titles = {
    all: "All", today: "Today", upcoming: "Next 7 days",
    nodate: "No date", completed: "Completed",
  };
  let title = titles[state.view];
  if (state.view.startsWith("list:")) title = state.view.slice(5);
  const count = visibleTasks().length;
  document.getElementById("viewTitle").innerHTML =
    `<button class="icon-btn mobile-menu" id="menuBtn">≡</button> ${title}`;
  document.getElementById("viewMeta").textContent = `${count} task${count === 1 ? "" : "s"}`;
  document.getElementById("menuBtn").onclick = () => {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("scrim").classList.add("show");
  };
}

function renderTaskList() {
  const list = document.getElementById("taskList");
  const tasks = visibleTasks();
  list.innerHTML = "";

  if (tasks.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="ico">✓</div>Nothing here. Enjoy the quiet.</div>`;
    return;
  }

  const groups = groupTasks(tasks);
  const renderGroup = (label, items) => {
    if (!items.length) return;
    const lbl = document.createElement("div");
    lbl.className = "task-group-label";
    lbl.textContent = label;
    list.appendChild(lbl);
    items.forEach(t => list.appendChild(renderTask(t)));
  };

  // Only group when in "all" or list views; flat for the date-specific views
  if (state.view === "all" || state.view.startsWith("list:")) {
    renderGroup("Overdue", groups.overdue);
    renderGroup("Today", groups.today);
    renderGroup("Next 7 days", groups.upcoming);
    renderGroup("Later", groups.later);
    renderGroup("No date", groups.none);
  } else {
    tasks.forEach(t => list.appendChild(renderTask(t)));
  }
}

function renderTask(t) {
  const wrap = document.createElement("div");
  wrap.style.display = "block";

  const row = document.createElement("div");
  row.className = "task" + (t.completed ? " completed" : "") + (state.selectedId === t.id ? " selected" : "");
  row.dataset.id = t.id;

  const cb = document.createElement("div");
  cb.className = "checkbox " + priorityClass(t.priority) + (t.completed ? " completed" : "");
  cb.onclick = (e) => { e.stopPropagation(); toggleTask(t.id); };

  const body = document.createElement("div");
  body.className = "task-body";

  const title = document.createElement("div");
  title.className = "task-title";
  title.textContent = t.title;

  const meta = document.createElement("div");
  meta.className = "task-meta";
  if (t.deadline) {
    const due = document.createElement("span");
    due.className = "due " + dueClass(t.deadline);
    due.textContent = "📅 " + fmtDate(t.deadline);
    meta.appendChild(due);
  } else {
    const due = document.createElement("span");
    due.className = "due none";
    due.textContent = "no date";
    meta.appendChild(due);
  }
  if (t.status) {
    const tag = document.createElement("span");
    const cls = t.status.toLowerCase().includes("not") ? "status-not-briefed"
      : t.status.toLowerCase().includes("progress") ? "status-in-progress"
      : "status-briefed";
    tag.className = "tag " + cls;
    tag.textContent = t.status;
    meta.appendChild(tag);
  }
  if (t.internal) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "👤 " + t.internal;
    meta.appendChild(tag);
  }
  if (t.external) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "🏢 " + t.external;
    meta.appendChild(tag);
  }

  body.appendChild(title);
  body.appendChild(meta);

  row.appendChild(cb);
  row.appendChild(body);

  if (t.subtasks && t.subtasks.length) {
    const toggle = document.createElement("button");
    const done = t.subtasks.filter(s => s.completed).length;
    toggle.className = "subtask-toggle";
    toggle.textContent = `▸ ${done}/${t.subtasks.length}`;
    toggle.onclick = (e) => {
      e.stopPropagation();
      const sub = wrap.querySelector(".subtasks");
      sub.classList.toggle("expanded");
      toggle.textContent = (sub.classList.contains("expanded") ? "▾ " : "▸ ") + `${done}/${t.subtasks.length}`;
    };
    row.appendChild(toggle);
  }

  row.onclick = () => selectTask(t.id);
  wrap.appendChild(row);

  if (t.subtasks && t.subtasks.length) {
    const sub = document.createElement("div");
    sub.className = "subtasks";
    t.subtasks.forEach(s => {
      const sr = document.createElement("div");
      sr.className = "subtask" + (s.completed ? " completed" : "");
      const scb = document.createElement("div");
      scb.className = "checkbox " + priorityClass(t.priority) + (s.completed ? " completed" : "");
      scb.onclick = (e) => { e.stopPropagation(); toggleSubtask(t.id, s.id); };
      const st = document.createElement("div");
      st.className = "subtask-title";
      st.textContent = s.title;
      sr.appendChild(scb);
      sr.appendChild(st);
      sub.appendChild(sr);
    });
    wrap.appendChild(sub);
  }

  return wrap;
}

function renderDetail() {
  const empty = document.getElementById("detailEmpty");
  const content = document.getElementById("detailContent");
  const detail = document.getElementById("detail");
  const app = document.getElementById("app");

  if (!state.selectedId) {
    empty.style.display = "flex";
    content.style.display = "none";
    detail.classList.remove("open");
    app.classList.add("detail-closed");
    document.getElementById("scrim").classList.remove("show");
    return;
  }
  const t = state.tasks.find(x => x.id === state.selectedId);
  if (!t) { state.selectedId = null; return renderDetail(); }

  app.classList.remove("detail-closed");
  detail.classList.add("open");
  empty.style.display = "none";
  content.style.display = "flex";

  content.innerHTML = `
    <div class="detail-header">
      <div class="checkbox ${priorityClass(t.priority)} ${t.completed ? "completed" : ""}" id="d-checkbox"></div>
      <textarea class="detail-title" id="d-title" rows="1">${escapeHtml(t.title)}</textarea>
      <button class="detail-close" id="d-close">×</button>
    </div>
    <div class="detail-body">
      <div class="field">
        <div class="field-label">Deadline</div>
        <div class="field-value"><input type="date" id="d-deadline" value="${t.deadline || ""}"></div>
      </div>
      <div class="field">
        <div class="field-label">Priority</div>
        <div class="field-value">
          <div class="priority-pills">
            ${[1,2,3,4].map(p => `<div class="priority-pill p${p} ${t.priority === p ? "active" : ""}" data-p="${p}">${priorityLabel(p)}</div>`).join("")}
          </div>
        </div>
      </div>
      <div class="field">
        <div class="field-label">Status</div>
        <div class="field-value">
          <select id="d-status">
            <option ${t.status === "Briefed" ? "selected" : ""}>Briefed</option>
            <option ${t.status === "Not briefed" ? "selected" : ""}>Not briefed</option>
            <option ${t.status === "In progress" ? "selected" : ""}>In progress</option>
            <option ${t.status === "Review" ? "selected" : ""}>Review</option>
            <option ${t.status === "Done" ? "selected" : ""}>Done</option>
          </select>
        </div>
      </div>
      <div class="field">
        <div class="field-label">List</div>
        <div class="field-value">
          <select id="d-list">
            <option ${t.list === "MyBL" ? "selected" : ""}>MyBL</option>
            <option ${t.list === "Rider Pack" ? "selected" : ""}>Rider Pack</option>
            <option ${t.list === "Creative" ? "selected" : ""}>Creative</option>
            <option ${t.list === "Brand" ? "selected" : ""}>Brand</option>
          </select>
        </div>
      </div>
      <div class="field">
        <div class="field-label">Internal</div>
        <div class="field-value"><input type="text" id="d-internal" value="${escapeHtml(t.internal)}" placeholder="—"></div>
      </div>
      <div class="field">
        <div class="field-label">External</div>
        <div class="field-value"><input type="text" id="d-external" value="${escapeHtml(t.external)}" placeholder="—"></div>
      </div>
      <div class="field" style="align-items: flex-start">
        <div class="field-label">Notes</div>
        <div class="field-value"><textarea id="d-notes" rows="2" placeholder="Add notes">${escapeHtml(t.notes || "")}</textarea></div>
      </div>

      <div class="subtask-section">
        <div class="subtask-section-label">Subtasks</div>
        <div id="d-subtasks"></div>
        <div class="add-subtask">
          <div class="checkbox p4" style="opacity:0.5"></div>
          <input id="d-newsubtask" type="text" placeholder="Add subtask">
        </div>
      </div>

      <button class="delete-btn" id="d-delete">Delete task</button>
    </div>
  `;

  // Render subtasks
  const subWrap = content.querySelector("#d-subtasks");
  (t.subtasks || []).forEach(s => {
    const row = document.createElement("div");
    row.className = "subtask" + (s.completed ? " completed" : "");
    row.innerHTML = `
      <div class="checkbox ${priorityClass(t.priority)} ${s.completed ? "completed" : ""}" data-sub="${s.id}"></div>
      <div class="subtask-title">${escapeHtml(s.title)}</div>
    `;
    row.querySelector(".checkbox").onclick = () => toggleSubtask(t.id, s.id);
    subWrap.appendChild(row);
  });

  // Bindings
  content.querySelector("#d-checkbox").onclick = () => toggleTask(t.id);
  content.querySelector("#d-close").onclick = () => { state.selectedId = null; render(); };
  content.querySelector("#d-title").oninput = (e) => {
    e.target.style.height = "auto";
    e.target.style.height = e.target.scrollHeight + "px";
    updateTask(t.id, { title: e.target.value });
  };
  // auto-size on initial render
  const ta = content.querySelector("#d-title");
  ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px";

  content.querySelector("#d-deadline").onchange = (e) => updateTask(t.id, { deadline: e.target.value || null });
  content.querySelector("#d-status").onchange = (e) => updateTask(t.id, { status: e.target.value });
  content.querySelector("#d-list").onchange = (e) => updateTask(t.id, { list: e.target.value });
  content.querySelector("#d-internal").oninput = (e) => updateTask(t.id, { internal: e.target.value });
  content.querySelector("#d-external").oninput = (e) => updateTask(t.id, { external: e.target.value });
  content.querySelector("#d-notes").oninput = (e) => updateTask(t.id, { notes: e.target.value });
  content.querySelectorAll(".priority-pill").forEach(el => {
    el.onclick = () => { updateTask(t.id, { priority: parseInt(el.dataset.p) }); };
  });
  content.querySelector("#d-newsubtask").onkeydown = (e) => {
    if (e.key === "Enter" && e.target.value.trim()) {
      addSubtask(t.id, e.target.value.trim());
      e.target.value = "";
    }
  };
  content.querySelector("#d-delete").onclick = () => {
    if (confirm("Delete this task?")) deleteTask(t.id);
  };
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

// ─────────────────────────────────────────────────────────────
// Actions
// ─────────────────────────────────────────────────────────────
function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  t.completed = !t.completed;
  save(); render();
}
function toggleSubtask(tid, sid) {
  const t = state.tasks.find(x => x.id === tid);
  if (!t) return;
  const s = t.subtasks.find(x => x.id === sid);
  if (!s) return;
  s.completed = !s.completed;
  // If all subtasks done, optionally hint by not auto-completing parent (TickTick doesn't auto-complete)
  save(); render();
}
function updateTask(id, patch) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  Object.assign(t, patch);
  save(); render();
}
function selectTask(id) {
  state.selectedId = id;
  render();
}
function deleteTask(id) {
  state.tasks = state.tasks.filter(x => x.id !== id);
  state.selectedId = null;
  save(); render();
}
function addTask(title) {
  const id = "t" + Date.now();
  const newTask = {
    id, title, deadline: null, priority: 4, status: "Not briefed",
    internal: "", external: "", notes: "",
    list: state.view.startsWith("list:") ? state.view.slice(5) : "MyBL",
    completed: false, subtasks: [],
  };
  state.tasks.push(newTask);
  save(); render();
}
function addSubtask(tid, title) {
  const t = state.tasks.find(x => x.id === tid);
  if (!t) return;
  t.subtasks = t.subtasks || [];
  t.subtasks.push({ id: "s" + Date.now(), title, completed: false });
  save(); render();
}

// ─────────────────────────────────────────────────────────────
// Wiring
// ─────────────────────────────────────────────────────────────
document.querySelectorAll(".nav-item[data-view]").forEach(el => {
  el.onclick = () => {
    state.view = el.dataset.view;
    state.selectedId = null;
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
    render();
  };
});
document.getElementById("addInput").onkeydown = (e) => {
  if (e.key === "Enter" && e.target.value.trim()) {
    addTask(e.target.value.trim());
    e.target.value = "";
  }
};
document.getElementById("sortBtn").onclick = () => {
  state.sortByDeadline = !state.sortByDeadline;
  render();
};
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("Reset to original task list? This will discard your changes.")) return;
  state.tasks = JSON.parse(JSON.stringify(SEED));
  state.selectedId = null;
  save(); render();
};
document.getElementById("scrim").onclick = () => {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("scrim").classList.remove("show");
};

// ─────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────
(function init() {
  load();
  render();
})();
</script>
</body>
</html>
